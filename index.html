<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0E1116" />
<title>Офлайн-мапа</title>
<style>
  :root{--bg:#0E1116;--panel:#161B22;--line:#232A33;--text:#E8EDF2;--muted:#8B97A4;--signal:#FFB000}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Roboto,sans-serif;overflow:hidden}
  #map{position:absolute;inset:0;background:#0b0e12;touch-action:none;cursor:grab}
  #map.drag{cursor:grabbing}
  #map::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;
    box-shadow:inset 0 0 120px 20px rgba(0,0,0,.45)}  /* м'яка віньєтка */
  #tiles img{position:absolute;width:256px;height:256px;display:block;pointer-events:none;
    transition:opacity .35s ease}

  #me{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;
    background:#3B9DFF;border:2.5px solid #fff;display:none;pointer-events:none;z-index:5;
    box-shadow:0 0 12px rgba(59,157,255,.9),0 1px 3px rgba(0,0,0,.6);
    transition:transform .18s linear}
  #meArrow{position:absolute;left:50%;top:-15px;width:0;height:0;margin-left:-8px;display:none;
    border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:14px solid #FFB000;
    filter:drop-shadow(0 0 5px rgba(255,176,0,.95))}
  #me::before{content:"";position:absolute;left:50%;top:50%;width:16px;height:16px;
    margin:-8px 0 0 -8px;border-radius:50%;background:rgba(59,157,255,.45);
    animation:pulse 2s ease-out infinite}
  @keyframes pulse{0%{transform:scale(1);opacity:.7}70%{transform:scale(3.4);opacity:0}100%{opacity:0}}

  #route{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
  #routeCasing{fill:none;stroke:rgba(7,9,12,.85);stroke-width:10;stroke-linejoin:round;stroke-linecap:round}
  #routeLine{fill:none;stroke:#FFB000;stroke-width:5.5;stroke-linejoin:round;stroke-linecap:round;
    filter:drop-shadow(0 0 6px rgba(255,176,0,.6))}
  #routeFlow{fill:none;stroke:#FFE08A;stroke-width:2.5;stroke-linecap:round;
    stroke-dasharray:2 22;animation:flow 1.1s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-24}}

  #dest{position:absolute;width:20px;height:20px;margin:-22px 0 0 -10px;display:none;
    pointer-events:none;z-index:5;filter:drop-shadow(0 3px 5px rgba(0,0,0,.55))}
  #dest::before{content:"";position:absolute;inset:0;background:#FF5A4D;
    border:2.5px solid #fff;border-radius:50% 50% 50% 0;transform:rotate(-45deg)}
  #dest::after{content:"";position:absolute;left:50%;top:42%;width:6px;height:6px;margin:-3px 0 0 -3px;
    background:#fff;border-radius:50%}

  .attrib{position:absolute;right:0;bottom:0;z-index:6;font-size:10px;color:var(--muted);
    background:rgba(14,17,22,.55);backdrop-filter:blur(4px);padding:3px 7px;border-top-left-radius:7px}
  .attrib a{color:var(--muted)}

  header{position:absolute;top:0;left:0;right:0;z-index:10;
    padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;display:flex;gap:6px;
    background:linear-gradient(#0E1116 35%,rgba(14,17,22,0));pointer-events:none}
  .badge{display:flex;align-items:center;gap:5px;font-size:11px;background:var(--panel);
    border:1px solid var(--line);padding:5px 9px;border-radius:999px;color:var(--muted)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
  .badge.on .dot{background:#35D07F}.badge.on{color:var(--text)}
  .badge.warn .dot{background:var(--signal)}.badge.warn{color:var(--text)}

  .zoom{position:absolute;left:12px;bottom:150px;z-index:10;display:flex;flex-direction:column;gap:6px}
  .zoom button,.locate{width:48px;height:48px;border-radius:12px;background:var(--panel);
    border:1px solid var(--line);color:var(--text);font-size:24px;display:flex;align-items:center;
    justify-content:center;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.4)}
  .locate{position:absolute;right:12px;bottom:150px;z-index:10;border-radius:50%;font-size:0}
  .layers{position:absolute;right:12px;bottom:210px;z-index:10;width:48px;height:48px;border-radius:50%;
    background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
    cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.4)}
  .stylepop{position:absolute;right:70px;bottom:200px;z-index:12;display:none;flex-direction:column;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;
    box-shadow:0 8px 24px rgba(0,0,0,.5)}
  .stylepop.show{display:flex}
  .stylepop button{border:none;background:none;color:var(--text);padding:11px 18px;font-size:14px;
    text-align:left;cursor:pointer;border-bottom:1px solid var(--line);white-space:nowrap}
  .stylepop button:last-child{border-bottom:none}
  .stylepop button.active{color:var(--signal);font-weight:700}
  .stylepop button:active{background:var(--line)}

  .dock{position:absolute;left:0;right:0;bottom:0;z-index:10;
    padding:14px 12px calc(env(safe-area-inset-bottom) + 14px);
    background:linear-gradient(rgba(14,17,22,0),#0E1116 40%)}
  button.dl{width:100%;border:1px solid var(--signal);background:var(--signal);color:#1a1200;
    padding:15px;border-radius:13px;font-size:15px;font-weight:700;display:flex;align-items:center;
    justify-content:center;gap:8px;cursor:pointer;min-height:52px}
  button.dl:active{transform:scale(.99)}button.dl:disabled{opacity:.55}
  .prog{margin-top:10px;display:none}.prog.show{display:block}
  .bar{height:8px;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .bar>i{display:block;height:100%;width:0;background:var(--signal);transition:width .15s}
  .lbl{font-size:12px;color:var(--muted);margin-top:6px;text-align:center}

  .searchbar{position:absolute;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 46px);z-index:11}
  .srow{display:flex;gap:8px}
  .srow input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);color:var(--text);
    padding:12px 14px;border-radius:12px;font-size:15px;outline:none;
    box-shadow:0 4px 14px rgba(0,0,0,.35);-webkit-user-select:text;user-select:text}
  .srow input::placeholder{color:var(--muted)}
  .srow button{flex:0 0 auto;width:48px;border:1px solid var(--line);background:var(--panel);color:var(--text);
    border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;
    box-shadow:0 4px 14px rgba(0,0,0,.35)}
  .results{margin-top:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;
    overflow:hidden;display:none;box-shadow:0 8px 24px rgba(0,0,0,.45)}
  .results.show{display:block}
  .results .r{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px;line-height:1.35}
  .results .r:last-child{border-bottom:none}
  .results .r:active{background:var(--line)}
  .results .r b{display:block;font-weight:600}
  .results .r span{color:var(--muted);font-size:12px}
  .results .r.msg{color:var(--muted);cursor:default}

  .routebar{position:absolute;left:12px;right:12px;bottom:84px;z-index:11;display:none;
    align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);
    border-radius:13px;padding:11px 12px;box-shadow:0 6px 20px rgba(0,0,0,.45)}
  .routebar.show{display:flex}
  .rb-main{flex:1;min-width:0}
  .rb-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rb-meta{font-size:12px;color:var(--muted);margin-top:2px}
  .routebar #rbClear{flex:0 0 auto;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);
    background:var(--bg);color:var(--text);font-size:16px;cursor:pointer}

  .intro{position:fixed;inset:0;z-index:50;background:rgba(8,10,13,.88);backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;padding:24px}
  .intro.hide{display:none}
  .introcard{max-width:340px;width:100%;background:var(--panel);border:1px solid var(--line);
    border-radius:18px;padding:24px;text-align:center}
  .introbadge{width:54px;height:54px;border-radius:14px;background:var(--signal);color:#1a1200;
    font-size:26px;font-weight:800;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
  .introcard h2{margin:0 0 8px;font-size:20px}
  .introcard p{margin:0 0 16px;color:var(--muted);font-size:14px;line-height:1.5}
  .introcard ol{text-align:left;margin:0 0 20px;padding-left:22px;font-size:14px;line-height:1.8}
  .introcard ol b{color:var(--signal)}
  .introcard button{width:100%;border:1px solid var(--signal);background:var(--signal);color:#1a1200;
    padding:14px;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
  <div id="map">
    <div id="tiles"></div>
    <svg id="route" preserveAspectRatio="none"><path id="routeCasing"/><path id="routeLine"/><path id="routeFlow"/></svg>
    <div id="dest"></div>
    <div id="me"><div id="meArrow"></div></div>
    <div class="attrib">© <a href="https://openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a></div>
  </div>

  <header>
    <div class="badge" id="bGps"><span class="dot"></span><span>GPS</span></div>
    <div class="badge" id="bNet"><span class="dot"></span><span>офлайн</span></div>
    <div class="badge" id="bMap"><span class="dot"></span><span>0 плиток</span></div>
  </header>

  <div class="searchbar">
    <div class="srow">
      <input id="q" type="search" placeholder="Куди їхати? Адреса…" autocomplete="off" enterkeyhint="search" />
      <button id="qbtn" title="Знайти">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
      </button>
    </div>
    <div id="results" class="results"></div>
  </div>

  <div class="routebar" id="routebar">
    <div class="rb-main">
      <div class="rb-name" id="rbName">—</div>
      <div class="rb-meta" id="rbMeta">—</div>
    </div>
    <button id="rbClear" title="Скинути маршрут">✕</button>
  </div>

  <div class="zoom">
    <button id="zin">+</button>
    <button id="zout">−</button>
  </div>
  <div class="locate" id="locate" title="До мене">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#E8EDF2" stroke-width="2">
      <circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
  </div>
  <div class="layers" id="layersBtn" title="Стиль карти">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#E8EDF2" stroke-width="2">
      <path d="M12 3 2 8l10 5 10-5-10-5z"/><path d="M2 13l10 5 10-5M2 18l10 5 10-5" opacity=".55"/></svg>
  </div>
  <div class="stylepop" id="stylePop">
    <button data-s="dark">Темна</button>
    <button data-s="light">Світла</button>
    <button data-s="sat">Супутник</button>
  </div>

  <div class="dock">
    <button class="dl" id="dl">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M7 11l5 5 5-5M5 21h14"/></svg>
      <span id="dlText">Завантажити цей район</span>
    </button>
    <div class="prog" id="prog"><div class="bar"><i id="bar"></i></div><div class="lbl" id="plbl">0%</div></div>
  </div>

<div class="intro" id="intro">
  <div class="introcard">
    <div class="introbadge">▲</div>
    <h2>Підготуй мапу до тривоги</h2>
    <p>Зроби це раз, поки є інтернет. Під час тривоги мережа не потрібна — GPS веде тебе по збереженій мапі.</p>
    <ol>
      <li>Знайди свій район на мапі</li>
      <li>Натисни <b>«Завантажити цей район»</b></li>
    </ol>
    <button id="introGo">Зрозуміло</button>
  </div>
</div>

<script>
'use strict';
const TILE=256, MINZ=3, MAXZ=19;
function sub(x,y){return ['a','b','c','d'][(((x+y)%4)+4)%4];}
const STYLES={
  dark:{name:'Темна',  attr:'© OpenStreetMap, © CARTO',
        url:(z,x,y)=>`https://${sub(x,y)}.basemaps.cartocdn.com/dark_all/${z}/${x}/${y}@2x.png`},
  light:{name:'Світла',attr:'© OpenStreetMap, © CARTO',
        url:(z,x,y)=>`https://${sub(x,y)}.basemaps.cartocdn.com/rastertiles/voyager/${z}/${x}/${y}@2x.png`},
  sat:{name:'Супутник',attr:'© Esri, Maxar, Earthstar Geographics',
        url:(z,x,y)=>`https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${y}/${x}`}
};
let style=localStorage.getItem('style'); if(!STYLES[style])style='dark';
const TILE_URL=(z,x,y)=>STYLES[style].url(z,x,y);
const DL_ZOOMS=[14,15,16,17], DL_CAP=2500, KYIV={lat:50.4501,lng:30.5234};

/* ---------- проекція Web Mercator ---------- */
function project(lat,lng,z){const s=TILE*2**z;
  const x=(lng+180)/360*s;
  const sin=Math.sin(lat*Math.PI/180);
  const y=(0.5-Math.log((1+sin)/(1-sin))/(4*Math.PI))*s;
  return {x,y};}
function unproject(x,y,z){const s=TILE*2**z;
  const lng=x/s*360-180;
  const n=Math.PI-2*Math.PI*y/s;
  const lat=180/Math.PI*Math.atan(0.5*(Math.exp(n)-Math.exp(-n)));
  return {lat,lng};}

/* напрямок руху: азимут від мене до точки попереду по маршруту (0°=північ) */
function bearingDeg(la1,ln1,la2,ln2){
  const f1=la1*Math.PI/180,f2=la2*Math.PI/180,dl=(ln2-ln1)*Math.PI/180;
  const y=Math.sin(dl)*Math.cos(f2);
  const x=Math.cos(f1)*Math.sin(f2)-Math.sin(f1)*Math.cos(f2)*Math.cos(dl);
  return (Math.atan2(y,x)*180/Math.PI+360)%360;
}
function headingToFollow(){
  if(!mePos)return null;
  if(routeCoords.length>1){
    const z=zoom, me=project(mePos.lat,mePos.lng,z);
    let bi=0,bd=Infinity;
    for(let i=0;i<routeCoords.length;i++){const p=project(routeCoords[i][0],routeCoords[i][1],z);
      const d=(p.x-me.x)**2+(p.y-me.y)**2; if(d<bd){bd=d;bi=i;}}
    let acc=0,target=routeCoords[routeCoords.length-1],prev=project(routeCoords[bi][0],routeCoords[bi][1],z);
    for(let i=bi+1;i<routeCoords.length;i++){const p=project(routeCoords[i][0],routeCoords[i][1],z);
      acc+=Math.hypot(p.x-prev.x,p.y-prev.y);prev=p;
      if(acc>=70){target=routeCoords[i];break;}}
    return bearingDeg(mePos.lat,mePos.lng,target[0],target[1]);
  }
  if(destination)return bearingDeg(mePos.lat,mePos.lng,destination.lat,destination.lng);
  return null;
}

/* ---------- IndexedDB для плиток ---------- */
const DB='offmap',STORE='tiles';
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,1);
  r.onupgradeneeded=()=>r.result.createObjectStore(STORE);
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function getTile(k){const d=await idb();return new Promise((res)=>{
  const r=d.transaction(STORE).objectStore(STORE).get(k);
  r.onsuccess=()=>res(r.result||null);r.onerror=()=>res(null);});}
async function putTile(k,blob){const d=await idb();return new Promise((res)=>{
  const t=d.transaction(STORE,'readwrite');t.objectStore(STORE).put(blob,k);
  t.oncomplete=()=>res();t.onerror=()=>res();});}
async function countTiles(){const d=await idb();return new Promise((res)=>{
  const r=d.transaction(STORE).objectStore(STORE).count();
  r.onsuccess=()=>res(r.result||0);r.onerror=()=>res(0);});}

/* ---------- стан мапи ---------- */
const saved=JSON.parse(localStorage.getItem('view')||'null');
let center=saved?{lat:saved.lat,lng:saved.lng}:KYIV;
let zoom=saved?saved.z:13;
let W=innerWidth,H=innerHeight;
const mapEl=document.getElementById('map'),tilesEl=document.getElementById('tiles'),meEl=document.getElementById('me');
const meArrowEl=document.getElementById('meArrow');
const destEl=document.getElementById('dest'),routeSvg=document.getElementById('route'),routeLineEl=document.getElementById('routeLine');
const routeCasingEl=document.getElementById('routeCasing'),routeFlowEl=document.getElementById('routeFlow');
let destination=null;   // {lat,lng,name}
let routeCoords=[];     // [[lat,lng],...]

const urlCache=new Map();      // key -> objectURL
const tileNodes=new Map();     // key -> img element
function tileKey(z,x,y){return style+'/'+z+'/'+x+'/'+y;}

function loadTileSrc(img,z,x,y){
  const key=tileKey(z,x,y);
  if(urlCache.has(key)){img.src=urlCache.get(key);return;}
  getTile(key).then(blob=>{
    if(blob){const u=URL.createObjectURL(blob);urlCache.set(key,u);img.src=u;return;}
    if(navigator.onLine){
      fetch(TILE_URL(z,x,y)).then(r=>r.ok?r.blob():null).then(b=>{
        if(!b)return; putTile(key,b);
        const u=URL.createObjectURL(b);urlCache.set(key,u);
        if(img.isConnected)img.src=u;
      }).catch(()=>{ if(img.isConnected)img.src=TILE_URL(z,x,y); });
    }
  });
}

let rafPending=false;
function requestRender(){if(rafPending)return;rafPending=true;requestAnimationFrame(()=>{rafPending=false;render();});}

function render(){
  W=innerWidth;H=innerHeight;
  const c=project(center.lat,center.lng,zoom);
  const originX=c.x-W/2, originY=c.y-H/2;
  const max=2**zoom;
  const x0=Math.floor(originX/TILE), x1=Math.floor((originX+W)/TILE);
  const y0=Math.floor(originY/TILE), y1=Math.floor((originY+H)/TILE);

  const need=new Set();
  for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++){
    if(y<0||y>=max)continue;
    const wx=((x%max)+max)%max;                 // горизонтальне «обгортання»
    const key=tileKey(zoom,wx,y);
    need.add(key);
    let img=tileNodes.get(key);
    if(!img){img=new Image();img.decoding='async';img.style.opacity='0';
      img.onload=()=>{img.style.opacity='1';};
      tileNodes.set(key,img);tilesEl.appendChild(img);loadTileSrc(img,zoom,wx,y);}
    img.style.left=(x*TILE-originX)+'px';
    img.style.top =(y*TILE-originY)+'px';
  }
  // прибрати зайві
  for(const [key,img] of tileNodes){if(!need.has(key)){img.remove();tileNodes.delete(key);}}

  // маршрут
  if(routeCoords.length>1){
    let d='';
    for(let i=0;i<routeCoords.length;i++){const p=project(routeCoords[i][0],routeCoords[i][1],zoom);
      d+=(i?'L':'M')+(p.x-originX).toFixed(1)+' '+(p.y-originY).toFixed(1)+' ';}
    routeCasingEl.setAttribute('d',d);routeLineEl.setAttribute('d',d);routeFlowEl.setAttribute('d',d);
  }else{routeCasingEl.setAttribute('d','');routeLineEl.setAttribute('d','');routeFlowEl.setAttribute('d','');}

  // точка Б
  if(destination){const p=project(destination.lat,destination.lng,zoom);
    destEl.style.left=(p.x-originX)+'px';destEl.style.top=(p.y-originY)+'px';destEl.style.display='block';}
  else destEl.style.display='none';

  // GPS-крапка + стрілка напрямку
  if(mePos){const p=project(mePos.lat,mePos.lng,zoom);
    meEl.style.left=(p.x-originX)+'px';meEl.style.top=(p.y-originY)+'px';meEl.style.display='block';
    const hd=headingToFollow();
    if(hd!=null){meEl.style.transform='rotate('+hd.toFixed(1)+'deg)';meArrowEl.style.display='block';}
    else{meEl.style.transform='none';meArrowEl.style.display='none';}
  }

  localStorage.setItem('view',JSON.stringify({lat:center.lat,lng:center.lng,z:zoom}));
}
function clearTiles(){for(const [,img] of tileNodes)img.remove();tileNodes.clear();}

/* ---------- зум зі збереженням точки під курсором ---------- */
function zoomTo(nz,sx,sy){
  nz=Math.max(MINZ,Math.min(MAXZ,Math.round(nz)));
  if(nz===zoom)return;
  const c=project(center.lat,center.lng,zoom);
  const wx=c.x-W/2+sx, wy=c.y-H/2+sy;          // світові px точки під пальцем
  const ll=unproject(wx,wy,zoom);
  zoom=nz;
  const np=project(ll.lat,ll.lng,zoom);         // та сама точка на новому зумі
  const ncx=np.x-(sx-W/2), ncy=np.y-(sy-H/2);   // новий центр у px
  center=unproject(ncx,ncy,zoom);
  clearTiles();render();
}
document.getElementById('zin').onclick=()=>zoomTo(zoom+1,W/2,H/2);
document.getElementById('zout').onclick=()=>zoomTo(zoom-1,W/2,H/2);
mapEl.addEventListener('wheel',e=>{e.preventDefault();zoomTo(zoom+(e.deltaY<0?1:-1),e.clientX,e.clientY);},{passive:false});
let lastTap=0;
mapEl.addEventListener('dblclick',e=>zoomTo(zoom+1,e.clientX,e.clientY));

/* ---------- панорамування + пінч ---------- */
const pts=new Map();let panStart=null,pinchStart=null;
mapEl.addEventListener('pointerdown',e=>{mapEl.setPointerCapture(e.pointerId);
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===1){mapEl.classList.add('drag');
    panStart={x:e.clientX,y:e.clientY,c:project(center.lat,center.lng,zoom)};
    const now=Date.now();if(now-lastTap<300){zoomTo(zoom+1,e.clientX,e.clientY);}lastTap=now;
  }else if(pts.size===2){const a=[...pts.values()];
    pinchStart={dist:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),zoom,
      mid:{x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2},c:project(center.lat,center.lng,zoom)};panStart=null;}
});
mapEl.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId))return;
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===1&&panStart){
    const dx=e.clientX-panStart.x, dy=e.clientY-panStart.y;
    center=unproject(panStart.c.x-dx,panStart.c.y-dy,zoom);
    requestRender();
  }else if(pts.size===2&&pinchStart){
    const a=[...pts.values()];
    const mid={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};
    const dx=mid.x-pinchStart.mid.x, dy=mid.y-pinchStart.mid.y;
    center=unproject(pinchStart.c.x-dx,pinchStart.c.y-dy,zoom);
    requestRender();
  }
});
function endPointer(e){
  if(pinchStart&&pts.size===2){
    const a=[...pts.values()];
    const dist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
    const nz=pinchStart.zoom+Math.log2(dist/pinchStart.dist);
    zoomTo(nz,pinchStart.mid.x,pinchStart.mid.y);
  }
  pts.delete(e.pointerId);
  if(pts.size<2)pinchStart=null;
  if(pts.size===0){mapEl.classList.remove('drag');panStart=null;}
}
mapEl.addEventListener('pointerup',endPointer);
mapEl.addEventListener('pointercancel',endPointer);
addEventListener('resize',requestRender);

/* ---------- GPS ---------- */
let mePos=null,firstFix=true;const bGps=document.getElementById('bGps');
if('geolocation' in navigator){
  navigator.geolocation.watchPosition(p=>{
    mePos={lat:p.coords.latitude,lng:p.coords.longitude};bGps.className='badge on';
    if(firstFix&&!saved){firstFix=false;center={...mePos};if(zoom<15)zoom=15;clearTiles();}
    render();
  },()=>{bGps.className='badge warn';},{enableHighAccuracy:true,maximumAge:3000,timeout:15000});
}
document.getElementById('locate').onclick=()=>{if(mePos){center={...mePos};if(zoom<16)zoom=16;clearTiles();render();}};

/* ---------- стиль карти ---------- */
const attribEl=document.querySelector('.attrib');
function setAttrib(){attribEl.textContent=STYLES[style].attr;}
const layersBtn=document.getElementById('layersBtn'),stylePop=document.getElementById('stylePop');
function markActive(){stylePop.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.s===style));}
layersBtn.onclick=e=>{e.stopPropagation();stylePop.classList.toggle('show');markActive();};
stylePop.querySelectorAll('button').forEach(b=>b.onclick=()=>{
  style=b.dataset.s;localStorage.setItem('style',style);
  stylePop.classList.remove('show');markActive();setAttrib();clearTiles();render();refreshCount();
});
document.addEventListener('click',e=>{if(!stylePop.contains(e.target)&&e.target!==layersBtn)stylePop.classList.remove('show');});
setAttrib();

/* ---------- мережа + лічильник ---------- */
const bNet=document.getElementById('bNet'),bMap=document.getElementById('bMap');
function netUI(){const on=navigator.onLine;bNet.className='badge '+(on?'on':'warn');
  bNet.querySelector('span:last-child').textContent=on?'онлайн':'офлайн';}
addEventListener('online',netUI);addEventListener('offline',netUI);netUI();
async function refreshCount(){const n=await countTiles();
  bMap.querySelector('span:last-child').textContent=n+' плиток';bMap.className='badge '+(n>0?'on':'');}

/* ---------- завантаження району ---------- */
function tilesForView(){
  const c=project(center.lat,center.lng,zoom);
  const tl=unproject(c.x-W/2,c.y-H/2,zoom), br=unproject(c.x+W/2,c.y+H/2,zoom);
  const list=[];
  for(const z of DL_ZOOMS){const s=2**z;
    const x0=Math.floor((tl.lng+180)/360*s), x1=Math.floor((br.lng+180)/360*s);
    const yT=lat2y(tl.lat,z), yB=lat2y(br.lat,z);
    for(let x=Math.min(x0,x1);x<=Math.max(x0,x1);x++)
      for(let y=Math.min(yT,yB);y<=Math.max(yT,yB);y++)
        if(x>=0&&y>=0&&x<s&&y<s)list.push([z,x,y]);
  }
  return list;
}
function lat2y(lat,z){const r=lat*Math.PI/180;
  return Math.floor((1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*2**z);}

const dlBtn=document.getElementById('dl'),dlText=document.getElementById('dlText'),
      prog=document.getElementById('prog'),bar=document.getElementById('bar'),plbl=document.getElementById('plbl');
dlBtn.onclick=async()=>{
  if(!navigator.onLine){alert('Немає інтернету. Спершу під'+"'"+'єднайся, щоб завантажити район.');return;}
  const list=tilesForView();
  if(list.length>DL_CAP){alert(`Область завелика: ${list.length} плиток (ліміт ${DL_CAP}). Наблизь карту ближче.`);return;}
  dlBtn.disabled=true;dlText.textContent='Завантаження…';prog.classList.add('show');
  let done=0;const total=list.length,CONC=6,q=list.slice();
  async function worker(){while(q.length){const [z,x,y]=q.pop();const key=tileKey(z,x,y);
    try{const ex=await getTile(key);
      if(!ex){const r=await fetch(TILE_URL(z,x,y));if(r.ok)await putTile(key,await r.blob());}
    }catch{}
    done++;const p=Math.round(done/total*100);bar.style.width=p+'%';plbl.textContent=`${p}% (${done}/${total})`;}}
  await Promise.all(Array.from({length:CONC},worker));
  plbl.textContent=`Готово ✓ ${total} плиток збережено офлайн`;
  dlBtn.disabled=false;dlText.textContent='Завантажити цей район';refreshCount();render();
};

/* ---------- маршрут А→Б ---------- */
const GEOCODE='https://nominatim.openstreetmap.org/search';
const ROUTER='https://router.project-osrm.org/route/v1/driving/';
const qEl=document.getElementById('q'),qbtn=document.getElementById('qbtn'),resultsEl=document.getElementById('results');
const routebar=document.getElementById('routebar'),rbName=document.getElementById('rbName'),rbMeta=document.getElementById('rbMeta');

function fmtKm(m){return m<1000?Math.round(m)+' м':(m/1000).toFixed(m<10000?1:0)+' км';}
function fmtMin(s){const m=Math.round(s/60);return m<60?m+' хв':Math.floor(m/60)+' год '+(m%60)+' хв';}

function showResults(html){resultsEl.innerHTML=html;resultsEl.classList.add('show');}
function hideResults(){resultsEl.classList.remove('show');}

async function geocode(q){
  if(!navigator.onLine){showResults('<div class="r msg">Немає інтернету. Адресу можна знайти лише зі зв\u0027язком — зроби це наперед.</div>');return;}
  showResults('<div class="r msg">Шукаю…</div>');
  const c=project(center.lat,center.lng,zoom);
  const tl=unproject(c.x-W,c.y-H,zoom), br=unproject(c.x+W,c.y+H,zoom); // ширша рамка для пріоритету
  const u=GEOCODE+'?format=json&limit=5&accept-language=uk&countrycodes=ua'+
    '&viewbox='+[tl.lng,tl.lat,br.lng,br.lat].join(',')+
    '&q='+encodeURIComponent(q);
  try{
    const r=await fetch(u,{headers:{'Accept':'application/json'}});
    const arr=await r.json();
    if(!arr.length){showResults('<div class="r msg">Нічого не знайдено. Спробуй уточнити адресу.</div>');return;}
    showResults(arr.map((it,i)=>{
      const parts=(it.display_name||'').split(',');
      const head=parts.slice(0,2).join(',').trim();
      const tail=parts.slice(2,5).join(',').trim();
      return `<div class="r" data-i="${i}"><b>${esc(head)}</b><span>${esc(tail)}</span></div>`;
    }).join(''));
    resultsEl.querySelectorAll('.r[data-i]').forEach(el=>{
      el.onclick=()=>{const it=arr[+el.dataset.i];
        pickDestination({lat:+it.lat,lng:+it.lon,name:(it.display_name||'').split(',').slice(0,2).join(',').trim()});};
    });
  }catch{showResults('<div class="r msg">Помилка пошуку. Перевір зв\u0027язок.</div>');}
}
function esc(t){return (t||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

async function pickDestination(d){
  destination=d;hideResults();qEl.value=d.name;qEl.blur();
  await buildRoute();
}

async function buildRoute(){
  if(!destination)return;
  const A=mePos||center;                     // старт: GPS, інакше центр мапи
  routebar.classList.add('show');
  rbName.textContent=destination.name;
  if(!navigator.onLine){
    rbMeta.textContent='Немає мережі — показую пряму лінію до точки';
    routeCoords=[[A.lat,A.lng],[destination.lat,destination.lng]];
    fitBounds(routeCoords);saveRoute();render();return;
  }
  rbMeta.textContent='Будую маршрут…';
  try{
    const u=ROUTER+`${A.lng},${A.lat};${destination.lng},${destination.lat}?overview=full&geometries=geojson`;
    const r=await fetch(u);const j=await r.json();
    if(j.code!=='Ok'||!j.routes?.length)throw 0;
    const rt=j.routes[0];
    routeCoords=rt.geometry.coordinates.map(c=>[c[1],c[0]]); // [lng,lat]→[lat,lng]
    rbMeta.textContent=`${fmtKm(rt.distance)} • ${fmtMin(rt.duration)} • збережено офлайн`;
    fitBounds(routeCoords);saveRoute();render();
  }catch{
    rbMeta.textContent='Не вдалось — показую пряму лінію';
    routeCoords=[[A.lat,A.lng],[destination.lat,destination.lng]];
    fitBounds(routeCoords);saveRoute();render();
  }
}

function fitBounds(pts){
  let minLa=90,maxLa=-90,minLn=180,maxLn=-180;
  for(const [la,ln] of pts){minLa=Math.min(minLa,la);maxLa=Math.max(maxLa,la);minLn=Math.min(minLn,ln);maxLn=Math.max(maxLn,ln);}
  center={lat:(minLa+maxLa)/2,lng:(minLn+maxLn)/2};
  for(let z=MAXZ;z>=MINZ;z--){
    const a=project(minLa,minLn,z),b=project(maxLa,maxLn,z);
    if(Math.abs(b.x-a.x)<W*0.82 && Math.abs(b.y-a.y)<H*0.62){zoom=z;break;}
  }
  clearTiles();
}

function saveRoute(){localStorage.setItem('route',JSON.stringify({destination,routeCoords}));}
function loadRoute(){
  const s=JSON.parse(localStorage.getItem('route')||'null');
  if(s&&s.destination){destination=s.destination;routeCoords=s.routeCoords||[];
    routebar.classList.add('show');rbName.textContent=destination.name;
    rbMeta.textContent=routeCoords.length>1?'Збережений маршрут — працює офлайн':'Точку збережено';}
}
document.getElementById('rbClear').onclick=()=>{
  destination=null;routeCoords=[];routebar.classList.remove('show');
  qEl.value='';localStorage.removeItem('route');render();
};
qbtn.onclick=()=>{const v=qEl.value.trim();if(v)geocode(v);};
qEl.addEventListener('keydown',e=>{if(e.key==='Enter'){const v=qEl.value.trim();if(v)geocode(v);}});
mapEl.addEventListener('pointerdown',hideResults);

/* ---------- перший запуск ---------- */
const intro=document.getElementById('intro');
if(localStorage.getItem('intro_done'))intro.classList.add('hide');
document.getElementById('introGo').onclick=()=>{intro.classList.add('hide');localStorage.setItem('intro_done','1');};

/* ---------- старт ---------- */
loadRoute();
render();refreshCount();
</script>
</body>
