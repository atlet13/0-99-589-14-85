<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DARK TRADING 2.0</title>
    <style>
        :root {
            --bg-main: #06090e;
            --card-bg: rgba(13, 18, 30, 0.95);
            --border-color: rgba(0, 240, 255, 0.15);
            --neon-blue: #00f0ff;
            --neon-purple: #9d00ff;
            --green: #00ff88;
            --red: #ff2a5f;
            --text-main: #ffffff;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(157, 0, 255, 0.15) 0%, transparent 60%),
                radial-gradient(circle at 50% 100%, rgba(0, 240, 255, 0.1) 0%, transparent 60%);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .app-container {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 28px;
            padding: 24px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(0, 240, 255, 0.03);
            backdrop-filter: blur(16px);
            position: relative;
            overflow: hidden;
        }

        .app-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon-blue), var(--neon-purple), transparent);
        }

        /* Шапка */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, var(--neon-purple), var(--neon-blue));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 20px;
            color: #fff;
            box-shadow: 0 0 15px rgba(157, 0, 255, 0.4);
        }

        .brand-title {
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #fff 0%, var(--neon-blue) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-subtitle {
            font-size: 10px;
            color: var(--text-muted);
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 700;
            color: var(--green);
            background: rgba(0, 255, 136, 0.08);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(0, 255, 136, 0.2);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background-color: var(--green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--green);
        }

        /* Форма вибору */
        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 8px;
            display: block;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        select {
            width: 100%;
            background: #090e17;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 14px 16px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            outline: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        select:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.25);
        }

        /* Кнопка аналізу */
        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, var(--neon-purple), #0066ff);
            border: none;
            color: #fff;
            padding: 16px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 25px rgba(157, 0, 255, 0.35);
            transition: transform 0.15s ease, box-shadow 0.2s ease;
            margin-top: 8px;
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        /* Індикатор завантаження */
        .loader-box {
            display: none;
            text-align: center;
            padding: 20px 0;
        }

        .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid rgba(0, 240, 255, 0.1);
            border-top: 3px solid var(--neon-blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 10px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loader-text {
            font-size: 12px;
            color: var(--neon-blue);
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* Блок сигналу */
        .signal-card {
            display: none;
            margin-top: 20px;
            background: rgba(9, 14, 23, 0.8);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid var(--border-color);
            text-align: center;
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .signal-icon-wrap {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            margin: 0 auto 12px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            border: 2px solid;
            box-shadow: 0 0 20px currentColor;
        }

        .signal-icon-wrap.up {
            color: var(--green);
            border-color: var(--green);
            background: rgba(0, 255, 136, 0.08);
        }

        .signal-icon-wrap.down {
            color: var(--red);
            border-color: var(--red);
            background: rgba(255, 42, 95, 0.08);
        }

        .signal-action {
            font-size: 22px;
            font-weight: 900;
            margin-bottom: 16px;
            letter-spacing: 0.5px;
        }

        .data-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .data-item {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: var(--text-muted);
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
        }

        .data-item span:last-child {
            color: #fff;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Шапка -->
        <div class="header">
            <div class="brand">
                <div class="brand-logo">D2</div>
                <div>
                    <div class="brand-title">DARK TRADING 2.0</div>
                    <div class="brand-subtitle">AI Technical Core</div>
                </div>
            </div>
            <div class="status-badge">
                <div class="status-dot"></div>
                ONLINE
            </div>
        </div>

        <!-- Вибір інструментів -->
        <div class="form-group">
            <label class="form-label">Валютна пара</label>
            <select id="pairSelect">
                <option value="EUR/JPY OTC">EUR/JPY OTC (+92%)</option>
                <option value="AED/CNY OTC">AED/CNY OTC (+92%)</option>
                <option value="AUD/CAD OTC">AUD/CAD OTC (+92%)</option>
                <option value="AUD/CHF OTC">AUD/CHF OTC (+92%)</option>
                <option value="AUD/NZD OTC">AUD/NZD OTC (+92%)</option>
                <option value="AUD/USD OTC">AUD/USD OTC (+92%)</option>
                <option value="CAD/CHF OTC">CAD/CHF OTC (+92%)</option>
                <option value="EUR/USD OTC">EUR/USD OTC (+63%)</option>
                <option value="GBP/USD OTC">GBP/USD OTC (+92%)</option>
                <option value="USD/CAD OTC">USD/CAD OTC (+92%)</option>
                <option value="USD/JPY OTC">USD/JPY OTC (+85%)</option>
                <option value="EUR/USD">EUR/USD (+59%)</option>
                <option value="GBP/USD">GBP/USD (+62%)</option>
                <option value="USD/JPY">USD/JPY (+38%)</option>
            </select>
        </div>

        <div class="form-group">
            <label class="form-label">Час експірації</label>
            <select id="tfSelect">
                <option value="M1 (1 хвилини)">M1 (1 хвилина)</option>
                <option value="M3 (3 хвилини)">M3 (3 хвилини)</option>
                <option value="M5 (5 хвилин)">M5 (5 хвилин)</option>
            </select>
        </div>

        <button class="btn-submit" onclick="generateSignal()">⚡ Отримати сигнал</button>

        <!-- Лоадер -->
        <div class="loader-box" id="loader">
            <div class="spinner"></div>
            <div class="loader-text">Розрахунок індикатора RSI & EMA...</div>
        </div>

        <!-- Результат -->
        <div class="signal-card" id="signalCard">
            <div class="signal-icon-wrap up" id="signalIcon">⬆</div>
            <div class="signal-action" id="signalText" style="color: var(--green);">ВВЕРХ (CALL)</div>

            <div class="data-list">
                <div class="data-item">
                    <span>Актив:</span>
                    <span id="resPair">EUR/JPY OTC</span>
                </div>
                <div class="data-item">
                    <span>Індикатор RSI (14):</span>
                    <span id="resRsi" style="color: var(--neon-blue);">28.4 (Oversold)</span>
                </div>
                <div class="data-item">
                    <span>Сила тренду:</span>
                    <span id="resConfidence" style="color: var(--green);">92%</span>
                </div>
                <div class="data-item">
                    <span>Час угоди:</span>
                    <span id="resTimeframe">M1</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Розрахунок RSI на основі віртуальної серії цінових змін
        function calculateTechnicalIndicators() {
            let prices = [100];
            for (let i = 1; i <= 20; i++) {
                let change = (Math.random() - 0.49) * 2;
                prices.push(prices[i - 1] + change);
            }

            let gains = 0, losses = 0;
            for (let i = prices.length - 14; i < prices.length; i++) {
                let diff = prices[i] - prices[i - 1];
                if (diff >= 0) gains += diff;
                else losses += Math.abs(diff);
            }

            let avgGain = gains / 14;
            let avgLoss = losses / 14;

            let rs = avgLoss === 0 ? 100 : avgGain / avgLoss;
            let rsi = 100 - (100 / (1 + rs));

            let isCall = rsi < 50; 
            let confidence = Math.floor(Math.abs(rsi - 50) * 1.2) + 75;
            if (confidence > 96) confidence = 96;

            return {
                rsi: rsi.toFixed(1),
                isCall: isCall,
                confidence: confidence
            };
        }

        function generateSignal() {
            document.getElementById('signalCard').style.display = 'none';
            document.getElementById('loader').style.display = 'block';

            setTimeout(() => {
                document.getElementById('loader').style.display = 'none';

                const techData = calculateTechnicalIndicators();
                const pair = document.getElementById('pairSelect').value;
                const tf = document.getElementById('tfSelect').value;

                const icon = document.getElementById('signalIcon');
                const text = document.getElementById('signalText');

                if (techData.isCall) {
                    icon.className = 'signal-icon-wrap up';
                    icon.innerText = '⬆';
                    text.innerText = 'ВВЕРХ (CALL)';
                    text.style.color = 'var(--green)';
                    document.getElementById('resRsi').innerText = `${techData.rsi} (Зона купівлі)`;
                } else {
                    icon.className = 'signal-icon-wrap down';
                    icon.innerText = '⬇';
                    text.innerText = 'ВНИЗ (PUT)';
                    text.style.color = 'var(--red)';
                    document.getElementById('resRsi').innerText = `${techData.rsi} (Зона продажу)`;
                }

                document.getElementById('resPair').innerText = pair.split(' (')[0];
                document.getElementById('resTimeframe').innerText = tf;
                document.getElementById('resConfidence').innerText = `${techData.confidence}%`;

                document.getElementById('signalCard').style.display = 'block';
            }, 800);
        }
    </script>
</body>
</html>
