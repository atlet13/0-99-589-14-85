<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Адмін-панель · Поліс</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <!-- LOGIN -->
  <div class="login-screen" id="loginScreen">
    <div class="login-card">
      <div class="brand">
        <svg viewBox="0 0 26 30" fill="none"><path d="M13 1 24 5v9c0 7-4.7 12.4-11 15C6.7 26.4 2 21 2 14V5l11-4Z" fill="#0e6e63"/><path d="m8.5 14.5 3 3 6-6.5" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Поліс · Адмін</span>
      </div>
      <p class="sub">Вхід для працівників</p>
      <label for="loginUser">Логін</label>
      <input id="loginUser" type="text" autocomplete="username" value="admin" />
      <label for="loginPass">Пароль</label>
      <input id="loginPass" type="password" autocomplete="current-password" />
      <button id="loginBtn">Увійти</button>
      <div class="login-err" id="loginErr"></div>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div class="dash" id="dash">
    <div class="topbar">
      <div class="inner">
        <div class="brand">
          <svg viewBox="0 0 26 30" fill="none"><path d="M13 1 24 5v9c0 7-4.7 12.4-11 15C6.7 26.4 2 21 2 14V5l11-4Z" fill="#0e6e63"/><path d="m8.5 14.5 3 3 6-6.5" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Поліс · Адмін-панель</span>
        </div>
        <button id="logoutBtn">Вийти</button>
      </div>
    </div>

    <div class="container">
      <div class="stats" id="stats"></div>

      <div class="toolbar">
        <input id="search" type="text" placeholder="Пошук: ПІБ, телефон, номер, email…" />
        <select id="filterStatus">
          <option value="">Усі статуси</option>
          <option value="new">Нові</option>
          <option value="review">На розгляді</option>
          <option value="approved">Підтверджені</option>
          <option value="issued">Видані</option>
          <option value="rejected">Відхилені</option>
        </select>
        <select id="filterType">
          <option value="">Усі види</option>
          <option value="osago">ОСЦПВ</option>
          <option value="kasko">КАСКО</option>
          <option value="medical">Медичне</option>
          <option value="travel">Туристичне</option>
          <option value="property">Майно</option>
          <option value="life">Життя</option>
        </select>
      </div>

      <div class="table-card">
        <table>
          <thead>
            <tr>
              <th>Номер</th>
              <th>Клієнт</th>
              <th class="hide-sm">Вид</th>
              <th class="hide-sm">Телефон</th>
              <th>Вартість</th>
              <th>Статус</th>
              <th class="hide-sm">Дата</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
        <div class="pager" id="pager"></div>
      </div>
    </div>
  </div>

  <!-- DRAWER -->
  <div class="drawer-overlay" id="overlay"></div>
  <aside class="drawer" id="drawer">
    <button class="close" id="drawerClose">×</button>
    <div id="drawerContent"></div>
  </aside>

  <script src="admin.js"></script>
</body>
</html>
